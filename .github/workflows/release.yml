name: Build & Release (Windows EXE)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Windows installer + portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Engine tests
        shell: bash
        run: |
          npm test 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Build Windows artifacts
        shell: bash
        run: |
          set -x
          node -v
          npx electron-builder --version
          ls node_modules/electron | head -5
          ls node_modules/electron/dist 2>/dev/null | head -5
          npx electron-builder --win --publish never 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          tail -n 150 build.log > ci-build-log.txt 2>/dev/null || echo "build.log отсутствует" > ci-build-log.txt
          { echo ""; echo "--- test.log ---"; tail -n 60 test.log 2>/dev/null || echo "test.log отсутствует"; } >> ci-build-log.txt
          node report-log.js
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --data @payload.json || true
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem release\*.exe | ForEach-Object {
            if ($_.Name -match 'Setup') { Rename-Item $_.FullName -NewName ("Nukefy-Setup-" + $v + ".exe") }
            else { Rename-Item $_.FullName -NewName ("Nukefy-Portable-" + $v + ".exe") }
          }
          Get-ChildItem release

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release\*.exe | ForEach-Object { ((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) + "  " + $_.Name }
          Set-Content -Path release\SHA256SUMS.txt -Value ($lines -join "`r`n")
          Get-Content release\SHA256SUMS.txt

      - name: List artifacts
        run: dir release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', '1.0.0') }}
          name: Nukefy ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/Nukefy-Setup-*.exe
            release/Nukefy-Portable-*.exe
            release/SHA256SUMS.txt
          body: |
            ## Nukefy — антивирус, антитроян и антимайнер

            - **Nukefy-Setup-<ver>.exe** — установщик (NSIS): ярлыки, меню «Пуск», удаление через «Программы и компоненты».
            - **Nukefy-Portable-<ver>.exe** — портативная версия: один файл, работает без установки.

            Что внутри: локальные сигнатуры и эвристики (вирусы / трояны / майнеры), проверка процессов,
            автозапуска, планировщика и hosts, резидентная защита, карантин с восстановлением,
            анализ ссылок и страниц (фишинг, слежка, трекеры, браузерные майнеры), облачные базы
            MalwareBazaar и URLhaus (abuse.ch) без ключа, VirusTotal — по бесплатному ключу пользователя.

            ### Про красный экран SmartScreen («Неизвестный издатель»)

            EXE не подписан сертификатом код-подписи (OV/EV-сертификаты — платная услуга удостоверяющих
            центров), поэтому SmartScreen предупреждает о любом молодом неподписанном приложении.
            Это не признак вредоносности: сверьте SHA-256 из `SHA256SUMS.txt` с файлом и нажимайте
            «Выполнить в любом случае» (или ПКМ по файлу → Свойства → «Разблокировать»).
            Репутация SmartScreen нарастает с количеством загрузок; полное снятие предупреждения —
            подпись сертификата, будет добавлена при его появлении.
